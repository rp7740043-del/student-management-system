# Use credentials and a database supplied by the hosting provider.
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST}:${MYSQLPORT:3306}/${MYSQLDATABASE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD}}

# Hibernate manages application tables; never execute the local MySQL schema script at startup.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Never deploy the public demo credentials. Set all four account variables before first startup.
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD}
app.bootstrap.teacher.username=${APP_BOOTSTRAP_TEACHER_USERNAME}
app.bootstrap.teacher.password=${APP_BOOTSTRAP_TEACHER_PASSWORD}
app.bootstrap.require-strong-passwords=true
app.demo-credentials.visible=false

spring.thymeleaf.cache=true
