<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | College ERP</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- Custom ERP Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="custom-card p-5 text-center shadow-lg" style="max-width: 520px;">
        <div class="mb-4">
            <span class="badge bg-warning-subtle text-warning fs-1 px-4 py-2 rounded-pill font-monospace">500</span>
        </div>
        <h3 class="fw-bold text-dark mb-2" th:text="${errorTitle != null ? errorTitle : 'Internal Server Error'}">Internal Server Error</h3>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected exception occurred while processing the request.'}">
            An unexpected error occurred.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/dashboard}" class="btn btn-primary px-4">
                <i class="fas fa-home me-1"></i> Return to Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-3">
                <i class="fas fa-arrow-left me-1"></i> Go Back
            </a>
        </div>
    </div>
</body>
</html>
