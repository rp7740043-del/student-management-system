<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | College ERP</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- Custom ERP Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="custom-card p-5 text-center shadow-lg" style="max-width: 500px;">
        <div class="mb-4">
            <span class="badge bg-danger-subtle text-danger fs-1 px-4 py-2 rounded-pill font-monospace">404</span>
        </div>
        <h3 class="fw-bold text-dark mb-2" th:text="${errorTitle != null ? errorTitle : 'Page Not Found'}">Page Not Found</h3>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested resource, student profile, or URL could not be located in our system.'}">
            The requested resource or page does not exist.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/dashboard}" class="btn btn-primary px-4">
                <i class="fas fa-home me-1"></i> Go to Dashboard
            </a>
            <a th:href="@{/students}" class="btn btn-outline-secondary px-3">
                <i class="fas fa-users me-1"></i> Student Directory
            </a>
        </div>
    </div>
</body>
</html>
