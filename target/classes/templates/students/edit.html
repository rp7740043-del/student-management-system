<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Student - College ERP</title>
</head>
<body>
<div th:replace="~{layout/main :: html(~{::#mainContent}, 'Edit Student Profile', 'viewStudents')}">
    <div id="mainContent">

        <div class="page-title-box">
            <div>
                <h1><i class="fas fa-user-edit text-primary me-2"></i>Update Student Profile</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/students}">Students</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Edit</li>
                    </ol>
                </nav>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{'/marks/entry/' + ${student.id}}" class="btn btn-outline-secondary">
                    <i class="fas fa-pen-nib me-1"></i> Edit Marks
                </a>
                <a th:href="@{'/attendance/entry/' + ${student.id}}" class="btn btn-outline-secondary">
                    <i class="fas fa-calendar-check me-1"></i> Edit Attendance
                </a>
                <a th:href="@{/students}" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-1"></i> Back to Directory
                </a>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="custom-card">
                    <div class="card-header-styled">
                        <h5>
                            <i class="fas fa-edit text-primary"></i>Editing: <span class="text-primary" th:text="${student.name}">Student Name</span>
                            <span class="badge bg-secondary ms-2" th:text="${student.studentId}">STU2024001</span>
                        </h5>
                    </div>

                    <div class="p-4">
                        <form th:action="@{'/students/edit/' + ${student.id}}" th:object="${student}" method="post">

                            <!-- Academic Enrollment Details Section -->
                            <h6 class="text-primary fw-bold text-uppercase mb-3 pb-1 border-bottom">
                                <i class="fas fa-graduation-cap me-1"></i> 1. Academic Details
                            </h6>

                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label for="studentId" class="form-label">Student ID / Roll No <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="studentId" th:field="*{studentId}" required
                                           th:classappend="${#fields.hasErrors('studentId')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label for="department" class="form-label">Department / Branch <span class="text-danger">*</span></label>
                                    <select class="form-select" id="department" th:field="*{department}" required>
                                        <option th:each="dept : ${departments}" th:value="${dept}" th:text="${dept}"></option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label for="classYear" class="form-label">Academic Class Year <span class="text-danger">*</span></label>
                                    <select class="form-select" id="classYear" th:field="*{classYear}" required>
                                        <option value="FE" th:selected="${student.classYear == 'FE'}">First Year (FE)</option>
                                        <option value="SE" th:selected="${student.classYear == 'SE'}">Second Year (SE)</option>
                                        <option value="TE" th:selected="${student.classYear == 'TE'}">Third Year (TE)</option>
                                        <option value="BE" th:selected="${student.classYear == 'BE'}">Final Year (BE)</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Personal Details Section -->
                            <h6 class="text-primary fw-bold text-uppercase mb-3 pb-1 border-bottom">
                                <i class="fas fa-user me-1"></i> 2. Personal &amp; Identity Details
                            </h6>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}" required
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>

                                <div class="col-md-3">
                                    <label for="gender" class="form-label">Gender <span class="text-danger">*</span></label>
                                    <select class="form-select" id="gender" th:field="*{gender}" required>
                                        <option value="Male" th:selected="${student.gender == 'Male'}">Male</option>
                                        <option value="Female" th:selected="${student.gender == 'Female'}">Female</option>
                                        <option value="Other" th:selected="${student.gender == 'Other'}">Other</option>
                                    </select>
                                </div>

                                <div class="col-md-3">
                                    <label for="dob" class="form-label">Date of Birth <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="dob" th:field="*{dob}" required
                                           th:classappend="${#fields.hasErrors('dob')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></div>
                                </div>
                            </div>

                            <!-- Contact Details -->
                            <h6 class="text-primary fw-bold text-uppercase mb-3 pb-1 border-bottom">
                                <i class="fas fa-address-book me-1"></i> 3. Contact &amp; Communication Details
                            </h6>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" required
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>

                                <div class="col-md-3">
                                    <label for="phone" class="form-label">Mobile Phone <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" id="phone" th:field="*{phone}" pattern="[0-9]{10}" maxlength="10" required
                                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                </div>

                                <div class="col-md-3">
                                    <label for="admissionDate" class="form-label">Admission Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="admissionDate" th:field="*{admissionDate}" required
                                           th:classappend="${#fields.hasErrors('admissionDate')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('admissionDate')}" th:errors="*{admissionDate}"></div>
                                </div>

                                <div class="col-12">
                                    <label for="address" class="form-label">Residential Address</label>
                                    <textarea class="form-control" id="address" th:field="*{address}" rows="2"></textarea>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a th:href="@{/students}" class="btn btn-light px-4">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4 shadow-sm">
                                    <i class="fas fa-save me-1"></i> Update Student
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
