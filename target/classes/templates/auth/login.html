<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Portal Login - Apex Institute of Technology</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- Custom ERP Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page-body">

    <div class="login-card">
        <div class="login-header">
            <img th:src="@{/images/logo.svg}" alt="Apex Institute Crest">
            <h3>Apex Institute of Technology</h3>
            <p class="mb-0">Enterprise Student Management Portal (ERP)</p>
            <span class="badge bg-primary-subtle text-primary mt-2">OOPS Mini Project</span>
        </div>

        <!-- Alert messages -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
            <i class="fas fa-exclamation-circle me-1"></i>
            <span th:text="${errorMessage}">Invalid credentials</span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small" role="alert">
            <i class="fas fa-check-circle me-1"></i>
            <span th:text="${successMessage}">Logged out successfully</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="usernameInput" class="form-label">
                    <i class="fas fa-user-circle me-1 text-primary"></i> Username
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" class="form-control" id="usernameInput" name="username" 
                           placeholder="Enter username" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="passwordInput" class="form-label">
                    <i class="fas fa-key me-1 text-primary"></i> Password
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control" id="passwordInput" name="password" 
                           placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3 shadow-sm">
                <i class="fas fa-sign-in-alt me-2"></i> Secure Admin Login
            </button>
        </form>

        <!-- Default Credentials Callout Box -->
        <div th:if="${showDemoCredentials}" class="p-3 bg-light rounded-3 border mt-3 text-center small">
            <div class="fw-bold text-dark mb-1">
                <i class="fas fa-info-circle text-primary me-1"></i> Default Demo Credentials:
            </div>
            <div class="text-muted">Username: <strong class="text-primary">admin</strong> | Password: <strong class="text-primary">admin123</strong></div>
            <div class="text-muted mt-1">Teacher: <strong class="text-secondary">teacher</strong> | Password: <strong class="text-secondary">teacher123</strong></div>
        </div>

        <div class="text-center mt-4 text-muted small">
            &copy; 2024–2025 Apex Institute of Technology &bull; OOPS Mini Project
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
