# ==============================================================================
# H2 In-Memory Database Profile (For quick local testing without MySQL)
# Activate by running: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:student_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# The root schema.sql contains MySQL-specific statements; Hibernate creates
# the schema for this fresh, in-memory database instead.
spring.sql.init.mode=never

# Keep the demo profile on the default portal URL, independently of MySQL.
server.port=8080

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
