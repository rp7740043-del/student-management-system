<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#gradBg)"/>

  <!-- Golden Stars & Sparkles -->
  <polygon points="120,60 123,68 131,68 125,73 127,81 120,76 113,81 115,73 109,68 117,68" fill="#fbbf24" opacity="0.8"/>
  <polygon points="680,80 683,88 691,88 685,93 687,101 680,96 673,101 675,93 669,88 677,88" fill="#fbbf24" opacity="0.9"/>
  <polygon points="400,40 402,46 408,46 403,50 405,56 400,52 395,56 397,50 392,46 398,46" fill="#fbbf24" opacity="0.6"/>

  <!-- Flying Mortarboards (Graduation Caps) -->
  <!-- Cap 1 -->
  <g transform="translate(180, 120) rotate(-15)">
    <polygon points="50,0 100,20 50,40 0,20" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <rect x="25" y="30" width="50" height="18" fill="#1e293b"/>
    <circle cx="50" cy="20" r="4" fill="#fbbf24"/>
    <path d="M50 20 Q 65 35 60 55" stroke="#fbbf24" stroke-width="3" fill="none"/>
    <rect x="57" y="55" width="6" height="12" fill="#fbbf24"/>
  </g>

  <!-- Cap 2 (Center) -->
  <g transform="translate(360, 80) rotate(8)">
    <polygon points="70,0 140,28 70,56 0,28" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <rect x="35" y="42" width="70" height="24" fill="#1e293b"/>
    <circle cx="70" cy="28" r="5" fill="#fbbf24"/>
    <path d="M70 28 Q 90 48 85 75" stroke="#fbbf24" stroke-width="3" fill="none"/>
    <rect x="81" y="75" width="8" height="15" fill="#fbbf24"/>
  </g>

  <!-- Cap 3 -->
  <g transform="translate(560, 140) rotate(22)">
    <polygon points="50,0 100,20 50,40 0,20" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <rect x="25" y="30" width="50" height="18" fill="#1e293b"/>
    <circle cx="50" cy="20" r="4" fill="#fbbf24"/>
    <path d="M50 20 Q 65 35 60 55" stroke="#fbbf24" stroke-width="3" fill="none"/>
    <rect x="57" y="55" width="6" height="12" fill="#fbbf24"/>
  </g>

  <!-- Diploma / Degree Certificate Scroll -->
  <g transform="translate(300, 260)">
    <rect x="0" y="20" width="200" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M-10 20 Q 0 10 10 20 L 10 120 Q 0 130 -10 120 Z" fill="#e2e8f0"/>
    <path d="M190 20 Q 200 10 210 20 L 210 120 Q 200 130 190 120 Z" fill="#e2e8f0"/>
    <!-- Red ribbon tied around scroll -->
    <rect x="85" y="16" width="30" height="108" fill="#ef4444" rx="2"/>
    <circle cx="100" cy="70" r="18" fill="url(#goldRibbon)"/>
    <circle cx="100" cy="70" r="14" fill="#ef4444"/>
    <polygon points="100,62 103,68 109,68 104,72 106,78 100,74 94,78 96,72 91,68 97,68" fill="#fbbf24"/>
  </g>
</svg>
