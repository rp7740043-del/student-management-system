# ==============================================================================
# College Student Management System - Application Configuration
# ==============================================================================
spring.application.name=College Student Management System
server.port=${PORT:8082}

# ------------------------------------------------------------------------------
# MySQL Database Configuration
# Database: student_db on localhost:3306
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:student_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ------------------------------------------------------------------------------
# Thymeleaf Configuration
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------------------
# App Specific Configurations
# ------------------------------------------------------------------------------
app.college.name=Apex Institute of Technology & Engineering
app.college.tagline=Accredited with 'A+' Grade by NAAC | Affiliated to State University
app.college.address=Knowledge Park Campus, Innovation Way, Pune - 411001
app.college.email=erp-admin@apextech.edu
app.college.phone=+91 (020) 2456-7890
